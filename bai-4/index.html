<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4 - Tính số ngày trong tháng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }
        .hop {
            background-color: white;
            padding: 20px;
            border: 1px solid #cccccc;
            max-width: 650px;
        }
        input, button {
            padding: 6px;
            margin: 5px;
        }
        button { cursor: pointer; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid black; padding: 8px; }
        #ketQua { color: blue; font-weight: bold; }

    </style>
</head>
<body>
    <div class="hop">
        <h2>Bài 4: Tính số ngày trong tháng</h2>
        <label>Nhập tháng:</label>
        <input type="number" id="thang" min="1" max="12" placeholder="1 - 12">
        <br>
        <label>Nhập năm:</label>
        <input type="number" id="nam" placeholder="Ví dụ: 2024">
        <br>
        <button onclick="tinhSoNgay()">Tính số ngày</button>
        <p id="ketQua"></p>
    </div>

    <script>
        function tinhSoNgay() {
            let thang = Number(document.getElementById("thang").value);
            let nam = Number(document.getElementById("nam").value);
            let ketQua = document.getElementById("ketQua");
            let soNgay;

            if (document.getElementById("thang").value === "" ||
                document.getElementById("nam").value === "" ||
                !Number.isInteger(thang) || !Number.isInteger(nam) ||
                thang < 1 || thang > 12 || nam < 1) {
                ketQua.innerText = "Vui lòng nhập tháng (1-12) và năm hợp lệ!";
                return;
            }

            switch (thang) {
                case 1: case 3: case 5: case 7:
                case 8: case 10: case 12:
                    soNgay = 31;
                    break;
                case 4: case 6: case 9: case 11:
                    soNgay = 30;
                    break;
                case 2:
                    if (nam % 400 === 0 || (nam % 4 === 0 && nam % 100 !== 0)) {
                        soNgay = 29;
                    } else {
                        soNgay = 28;
                    }
                    break;
            }
            ketQua.innerText = "Tháng " + thang + " năm " + nam + " có " + soNgay + " ngày.";
        }
    </script>
</body>
</html>
